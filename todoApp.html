<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="todoApp.css">
</head>
<body>

    <header></header>

    <main>
        <section id="notification"></section>

        <section class="content">

            <div id="todo-app">

                <h1>To-Do App</h1>

                <input
                    type="text"
                    placeholder="Example: Learn HTML, Learn CSS, Build Project"
                >

                <div class="btn-container">
                    <button id="add-tasks" class="todo-btn">
                        Add Tasks
                    </button>

                    <button id="delete-tasks" class="todo-btn">
                        Delete Tasks
                    </button>
                </div>

                <h2>Tasks :</h2>

                <div id="show-tasks"></div>

            </div>
            
        </section>
    </main>

    <footer></footer>

    <script src="todoApp.js"></script>
</body>
</html>
